<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de velocidade</title>

    <style>
        *{
            padding: 10px;
            margin: 0;
            box-sizing: border-box;
            
        }
        h1{
            background-color: gray;
           
        }
        body{
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Teste de velocidade</h1>
    <div>
        <input type="number" name="km" id="km" value="" placeholder="Digite apenas numeros">
        <input type="button" value="Testar" onclick="teste()">
        <h2>Esperando...</h2>
    </div>

    <script>
        let velocidade;
        function teste(){
        velocidade = Number(window.document.querySelector('input#km').value);
        if(velocidade > 80){
            window.document.querySelector('h2').innerText = 'Voce foi multado';
            window.document.querySelector('h2').style.backgroundColor = 'red';
        } else{
            window.document.querySelector('h2').innerText = 'Voce não foi multado';
            window.document.querySelector('h2').style.backgroundColor = 'green';
        }
        }
    </script>
</body>
</html>
