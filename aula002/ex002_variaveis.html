<script>
    let msg;  // Criação de variaveis: Const(o valor nunca muda) e Let(Pode mudar o valor)
    let nome, n1, n2, soma;

    nome = window.prompt("Digite seu nome!");

    n1 = window.prompt("Digite um numero: ");
    n2 = window.prompt("Digite outro numero: ");
    soma = n1+n2;
    window.alert("A soma dos numeros digitado é: " + soma);

    /* 
    Em Js o + serve para concatenação(junção de strings) e para soma de numeros. O window.prompt captura
    strings, então temos que passar o tipo de dado de string para number
    */

    n1 = Number.parseInt(window.prompt("Digite um numero: ")); // Number.parseInt serve para trocar o tipo da variavel para inteiro
    n2 = Number.parseInt(window.prompt("Digite outro numero: "));//E o Number.parseFloat serve para trocar o tipo da variavel para ponto flutuante
    soma = n1+n2;
    window.alert("A soma dos numeros digitado é: " + soma);


    n1 = Number(window.prompt("Digite um numero: ")); // Com apenas Number o JS indentifica qual tipo de dado vai ser preciso usar
    n2 = Number(window.prompt("Digite outro numero: ")); // Mas para forçar um resultado se quiser int ou float é preciso usar Number.ParseTIPO
    soma = n1+n2;
    window.alert("A soma dos numeros digitado é: " + soma);

    //Se quiser passar algum dado para String coloca String(n) ou n.toString
    n1 = Number(window.prompt("Digite um numero: ")); // Com apenas Number o JS indentifica qual tipo de dado vai ser preciso usar
    n2 = Number(window.prompt("Digite outro numero: ")); // Mas para forçar um resultado se quiser int ou float é preciso usar Number.ParseTIPO
